---
applications:
  - name: onceler
    default-route: true
    buildpacks:
      # Pinned to upstream v1.11.5 for Ruby 3.4.13 (fixes the 2026-11-18
      # Regexp/String advisory); cloud.gov's system ruby_buildpack (v1.11.1)
      # only supports up to 3.4.7.
      # Revert to `ruby_buildpack` once cloud.gov ships >= v1.11.5.
      - https://github.com/cloudfoundry/ruby-buildpack/releases/download/v1.11.5/ruby-buildpack-cflinuxfs4-v1.11.5.zip
    memory: 256M
    stack: cflinuxfs4
